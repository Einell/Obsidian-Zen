name: Publish existing release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-existing-release.yml

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish 1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Einell/Obsidian-Zen
        run: gh release edit 1.0.0 --repo Einell/Obsidian-Zen --draft=false
